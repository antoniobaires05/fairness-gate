name: fairness-gate

on:
  push:
  pull_request:
  # "Run workflow" button on the Actions tab; pick a champion to demo a failing or passing build.
  workflow_dispatch:
    inputs:
      champion:
        description: "Champion model (blank = value in ml/fairness_thresholds.yaml)"
        type: choice
        default: ""
        options: ["", vendor_a_logreg, vendor_b_gbm, vendor_c_biased, vendor_a_mitigated]

permissions:
  contents: read

env:
  # data/ is gitignored, so CI downloads the datasets.
  # South German Credit (corrected), UCI #573 -- static file, hash must match exactly.
  GERMAN_URL: https://archive.ics.uci.edu/static/public/573/south+german+credit+update.zip
  GERMAN_SHA256: 5f363343f356ca38a0236baab849e472846399b2176ccc5bd686483dd8a7562f
  # HMDA, Delaware 2024, CFPB Data Browser. CFPB can republish a year's data, so a hash
  # change is a warning (the log shows which file was used), not a failure.
  HMDA_URL: https://ffiec.cfpb.gov/v2/data-browser-api/view/csv?states=DE&years=2024
  HMDA_SHA256: 305649ebe25db31755fe93f259930de9e016c7ee7f24a3386d4e6ea3bc8c2e30

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # true once the FAIRNESS_SQL_CONNECTION_STRING repository secret exists (see docs/azure_setup.md)
      HAS_WAREHOUSE: ${{ secrets.FAIRNESS_SQL_CONNECTION_STRING != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # numpy 2.5 in ml/requirements.txt needs >= 3.12
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Fetch datasets
        run: |
          mkdir -p data/raw/hmda
          curl -fsSL "$GERMAN_URL" -o /tmp/sgc.zip
          unzip -o /tmp/sgc.zip SouthGermanCredit.asc -d data/raw
          echo "$GERMAN_SHA256  data/raw/SouthGermanCredit.asc" | sha256sum --check
          curl -fsSL --retry 3 "$HMDA_URL" -o data/raw/hmda/hmda_2024_DE.csv
          if ! echo "$HMDA_SHA256  data/raw/hmda/hmda_2024_DE.csv" | sha256sum --check; then
            echo "::warning::HMDA file changed upstream: $(sha256sum data/raw/hmda/hmda_2024_DE.csv)"
          fi

      - name: Unit tests
        run: pytest ml/tests warehouse/tests

      - name: Ingest HMDA
        run: python -m ml.ingest_hmda

      - name: Champion vs challenger + fairness gate
        id: gate
        # Trains every configured model, gates each, and exits with the champion's result.
        run: python -m ml.compare --dataset hmda ${CHAMPION:+--champion "$CHAMPION"}
        env:
          CHAMPION: ${{ inputs.champion }}

      - name: Load audit into Azure SQL
        # Runs for failing builds too (the dashboard shows both); skipped until the secret exists.
        if: ${{ !cancelled() && env.HAS_WAREHOUSE == 'true' && hashFiles('ml/reports/hmda/comparison.json') != '' }}
        run: |
          sudo apt-get install -y -qq libltdl7 libkrb5-3 libgssapi-krb5-2 > /dev/null
          python -m warehouse.etl --dataset hmda --init-schema
        env:
          FAIRNESS_SQL_CONNECTION_STRING: ${{ secrets.FAIRNESS_SQL_CONNECTION_STRING }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fairness-reports
          path: ml/reports/
          if-no-files-found: ignore
