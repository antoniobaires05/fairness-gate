name: fairness-gate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # South German Credit (corrected), UCI #573. data/ is gitignored, so CI downloads it
  # and checks the hash so a changed upstream file can't silently change results.
  DATASET_URL: https://archive.ics.uci.edu/static/public/573/south+german+credit.zip
  DATASET_SHA256: 5f363343f356ca38a0236baab849e472846399b2176ccc5bd686483dd8a7562f

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # numpy 2.5 in ml/requirements.txt needs >= 3.12
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Fetch dataset
        run: |
          mkdir -p data/raw
          curl -fsSL "$DATASET_URL" -o /tmp/sgc.zip
          unzip -o /tmp/sgc.zip SouthGermanCredit.asc -d data/raw
          echo "$DATASET_SHA256  data/raw/SouthGermanCredit.asc" | sha256sum --check

      - name: Unit tests
        run: pytest ml/tests

      - name: Ingest
        run: python -m ml.ingest

      - name: Train
        run: python -m ml.train

      - name: Fairness gate
        run: python -m ml.fairness_eval

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fairness-reports
          path: ml/reports/
          if-no-files-found: ignore
